version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
    schedule:
      interval: "monthly"
  - package-ecosystem: "terraform"
    # The examples and the vendored module pin the same module sources as the
    # root, so they go stale unless they are watched too.
    directories:
      - "/"
      - "/examples/*"
      - "/modules/*"
    labels:
      - dependencies
      - terraform
    schedule:
      interval: "weekly"
